<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/eventListeners.js"></script>
    <script type="module" src="js/util.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar container">
        <a href="/" class="logo">Movie Explorer</a>
        <button class="menu-btn" aria-label="Open menu">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            class="menu-icon"
          >
            <path
              stroke="currentColor"
              d="M4 6H20M4 12H20M4 18H20"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="hero-content container">
          <h1>Movie Explorer</h1>
          <p class="search-guide-text">
            Search for your favorite movies by title...
          </p>
          <form class="search-form">
            <input
              type="search"
              name="movie-name"
              class="search-input"
              placeholder="Search movie"
              id="movie-search"
              aria-label="Search movie"
            />
            <button type="submit" class="submit-btn">Search</button>
          </form>
          <p class="search-example-text">
            Example: Batman, Avengers, Interstellar, ...
          </p>
        </div>
      </section>
      <section class="search-results container">
        <!-- movie cards -->
        <h2>Search results for <span class="search-title">"batman"</span></h2>
        <h3 class="section-heading">Titles</h3>
        <ul class="results-list">
          <!-- Search Result Cards Come Here -->
        </ul>
      </section>
    </main>
    <footer>
      <p class="footer-text">
        Made with &hearts; by
        <a
          href="https://github.com/Yasin-Fathollahi"
          target="_blank"
          rel="noopener noreferrer"
          >Yasin</a
        >
      </p>
    </footer>
  </body>
</html>
